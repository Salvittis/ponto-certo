name: ponto-certo
services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile.llm
      args:
        APP_REVISION: ${APP_REVISION:-development}
    image: ponto-certo-llm:local
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: 3g
    networks: [backend]
  app:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-development}
    image: ponto-certo:local
    restart: unless-stopped
    depends_on:
      llm:
        condition: service_healthy
    environment:
      LLM_BASE_URL: http://llm:8081/v1
      LLM_MODEL: qwen2.5-1.5b-instruct
      LLM_TIMEOUT_SECONDS: "90"
      DATA_MODE: ${DATA_MODE:-demo}
      SPTRANS_TOKEN: ${SPTRANS_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      APP_REVISION: ${APP_REVISION:-development}
    ports: ["127.0.0.1:${APP_HOST_PORT:-8000}:8000"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 512m
    networks: [backend, outbound]
networks:
  backend:
    internal: true
  outbound: {}
