name: Deploy Blindado

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blindado-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Gitleaks / full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-security.sh gitleaks
      - name: Preserve redacted findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-${{ github.sha }}
          path: reports/security/gitleaks.json
          retention-days: 14
          if-no-files-found: warn

  deploy_aws:
    name: Deploy to AWS Academy / session
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: aws-academy
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the current Academy session credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          force-skip-oidc: true
          unset-current-credentials: true
          output-credentials: false
          mask-aws-account-id: true
      - name: Deploy approved digests through SSM and verify public inference
        env:
          AWS_ENABLED: ${{ vars.AWS_ENABLED }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          AWS_PUBLIC_URL: ${{ vars.AWS_PUBLIC_URL }}
          AWS_SESSION_VALID_UNTIL: ${{ vars.AWS_SESSION_VALID_UNTIL }}
          IMAGE_REF: ${{ needs.publish.outputs.app_ref }}
          LLM_IMAGE_REF: ${{ needs.publish.outputs.llm_ref }}
          PROXY_IMAGE_REF: ${{ needs.publish.outputs.proxy_ref }}
          APP_REVISION: ${{ github.sha }}
          DATA_MODE: ${{ vars.AWS_DATA_MODE || 'demo' }}
          METRICS_TOKEN: ${{ secrets.AWS_METRICS_TOKEN }}
          SPTRANS_TOKEN: ${{ secrets.AWS_SPTRANS_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: python3 scripts/deploy-aws.py
      - name: Preserve AWS validation and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-aws-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            reports/aws-deployment.json
            reports/aws-deployment-failure.json
            reports/aws-smoke-public.json
          retention-days: 14
          if-no-files-found: warn

  semgrep:
    name: Semgrep / security policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-security.sh semgrep
      - name: Preserve static-analysis findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-${{ github.sha }}
          path: reports/security/semgrep.json
          retention-days: 14
          if-no-files-found: warn

  tests:
    name: API regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install the application and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -c requirements.lock -r requirements-dev.txt
          python -m pip check
      - name: Run contract and failure-mode tests
        run: python -m pytest tests -q --junitxml=reports/tests.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ github.sha }}
          path: reports/tests.xml
          retention-days: 14
          if-no-files-found: warn

  images:
    name: Build + Trivy / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            dockerfile: Dockerfile
            suffix: ''
          - component: llm
            dockerfile: Dockerfile.llm
            suffix: '-llm'
          - component: proxy
            dockerfile: Dockerfile.proxy
            suffix: '-proxy'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Calculate the immutable version tag
        id: image
        env:
          COMPONENT_SUFFIX: ${{ matrix.suffix }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          printf 'tag=ghcr.io/%s%s:%s\n' "$repository" "$COMPONENT_SUFFIX" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build once, without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          build-args: APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.component }}.tar
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Validate the real HTTPS proxy configuration without network access
        if: matrix.component == 'proxy'
        run: |
          docker load --input "$RUNNER_TEMP/proxy.tar"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 10001:10001 \
            --tmpfs /tmp:uid=10001,gid=10001,mode=1777 \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            --tmpfs /config:uid=10001,gid=10001,mode=0700 \
            -e PUBLIC_HOST=example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "${{ steps.image.outputs.tag }}" caddy validate \
            --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Block HIGH/CRITICAL vulnerabilities and secrets
        run: scripts/check-security.sh image "${{ runner.temp }}/${{ matrix.component }}.tar"
      - name: Preserve vulnerability findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.component }}-${{ github.sha }}
          path: reports/security/trivy-image.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve the exact scanned image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.component }}.tar
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  publish:
    name: Publish the approved images
    needs: [gitleaks, semgrep, tests, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      app_ref: ${{ steps.publish.outputs.app_ref }}
      llm_ref: ${{ steps.publish.outputs.llm_ref }}
      proxy_ref: ${{ steps.publish.outputs.proxy_ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push without rebuilding and resolve registry digests
        id: publish
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          for component in app llm proxy; do
            suffix=''
            if [[ "$component" != app ]]; then suffix="-${component}"; fi
            tag="ghcr.io/${repository}${suffix}:${GITHUB_SHA}"
            docker load --input "$RUNNER_TEMP/images/${component}.tar"
            docker push "$tag"
            digest_ref="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
            [[ "$digest_ref" == "ghcr.io/${repository}${suffix}@sha256:"* ]]
            printf '%s_ref=%s\n' "$component" "$digest_ref" >> "$GITHUB_OUTPUT"
            printf '%s: `%s`\n' "$component" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    name: Deploy to Azure / production
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to Azure using a short-lived OIDC token
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Deploy the verified image digests and check readiness
        env:
          IMAGE_REF: ${{ needs.publish.outputs.app_ref }}
          LLM_IMAGE_REF: ${{ needs.publish.outputs.llm_ref }}
          PROXY_IMAGE_REF: ${{ needs.publish.outputs.proxy_ref }}
          APP_REVISION: ${{ github.sha }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          DATA_MODE: ${{ vars.DATA_MODE || 'demo' }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SPTRANS_TOKEN: ${{ secrets.SPTRANS_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: python3 scripts/deploy-azure.py
      - name: Preserve public validation and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            reports/deployment.json
            reports/deployment-failure.json
            reports/smoke-public.json
          retention-days: 14
          if-no-files-found: warn
